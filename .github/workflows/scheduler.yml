name: Run Feed Processor

on:
  schedule:
    - cron: '0 * * * *'   # Runs every 1 hour
  workflow_dispatch:      # Allows manual trigger

jobs:
  run-processor:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Decryption and Scraper
      run: |
        python fetch_and_decrypt.py

    - name: Commit and Push Decrypted Files
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add public_decrypted/
        git commit -m "chore: update decrypted data feeds [skip ci]" || exit 0
        git push
